name: "CodeQL Advanced"

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Full commit SHA or branch to analyze"
        required: true
        default: "3.3"
        type: string

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none

    steps:
      - name: Checkout selected commit or branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 1

      - name: Confirm checked-out commit
        shell: bash
        run: |
          echo "Requested ref: ${{ inputs.target_ref }}"
          echo "Checked-out commit:"
          git rev-parse HEAD

      - name: Initialize CodeQL
        id: codeql-init
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.20.1/codeql-bundle-linux64.tar.zst

      - name: Confirm CodeQL CLI version
        shell: bash
        run: echo "CodeQL CLI version: ${{ steps.codeql-init.outputs.codeql-version }}"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
